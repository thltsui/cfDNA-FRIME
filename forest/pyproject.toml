[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frime-forest"
version = "0.1.0"
description = "Poisson-cluster FRIME simulation with controlled stationary history truncation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["frime_forest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
